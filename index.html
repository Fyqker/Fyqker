<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HasanGPT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <main class="container">
      <header class="header">
        <h1>HasanGPT</h1>
        <p>Gemini API ile çalışan modern web chatbot</p>
      </header>

      <section class="config-card">
        <label for="apiKey">Gemini API Key</label>
        <div class="input-row">
          <input
            type="password"
            id="apiKey"
            placeholder="AIza..."
            autocomplete="off"
          />
          <button id="toggleKey" class="secondary-btn" type="button">Göster</button>
        </div>

        <label for="model">Model</label>
        <input type="text" id="model" value="gemini-1.5-flash" />

        <p class="hint">
          Not: API anahtarınız yalnızca bu tarayıcı sekmesinde kullanılır.
        </p>
      </section>

      <section class="chat-card">
        <div id="chatMessages" class="chat-messages">
          <div class="message bot">
            <div class="bubble">Merhaba! Ben HasanGPT. Sana nasıl yardımcı olabilirim?</div>
          </div>
        </div>

        <form id="chatForm" class="chat-form">
          <textarea
            id="prompt"
            placeholder="Mesajını yaz..."
            rows="2"
            required
          ></textarea>
          <button type="submit" id="sendBtn">Gönder</button>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
